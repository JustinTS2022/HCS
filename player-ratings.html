<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Player Ratings — Hebron Championship Series</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<nav data-nav></nav>
<main>
  <h1>Player Ratings</h1>
  <div class="subtitle">Role-aware Value score (0-100) for every player in every role they've played. "Wtd 100" is that player-role scored relative to the best player-role performance in the league this season.</div>
  <div class="filters" id="role-filters"></div>
  <div class="panel">
    <div class="table-scroll" id="ratings-table">
      <div class="loading">Loading live ratings…</div>
    </div>
  </div>
</main>
<footer>Data pulled live from the Hebron Championship Series Google Sheet.</footer>
<script src="assets/app.js"></script>
<script>
  buildNav("player-ratings.html");

  const ROLES = ["All", "Top", "Jungle", "Mid", "ADC", "Support"];
  let allRows = [];

  function render(role) {
    const container = document.getElementById("ratings-table");
    let rows = allRows.filter((r) => Number(r[2]) > 0); // hide unplayed roles
    if (role !== "All") rows = rows.filter((r) => r[1] === role);
    rows.sort((a, b) => Number(b[5]) - Number(a[5])); // Value desc

    const headers = ["Player", "Role", "Games", "Win %", "Value", "Wtd 100", "KDA", "Kills/G", "Deaths/G", "Assists/G"];
    const displayRows = rows.map((r) => [r[0], r[1], r[2], r[4], r[5], r[6], r[7], r[8], r[9], r[10]]);
    renderTable(container, headers, displayRows);
  }

  (async function () {
    const container = document.getElementById("ratings-table");
    try {
      allRows = await fetchSheet("Player Ratings");
      allRows.shift(); // drop mangled header row

      const filterBar = document.getElementById("role-filters");
      ROLES.forEach((role, i) => {
        const btn = el("button", { text: role, class: i === 0 ? "active" : "" });
        btn.addEventListener("click", () => {
          filterBar.querySelectorAll("button").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          render(role);
        });
        filterBar.appendChild(btn);
      });

      render("All");
    } catch (err) {
      showError(container, err);
    }
  })();
</script>
</body>
</html>
